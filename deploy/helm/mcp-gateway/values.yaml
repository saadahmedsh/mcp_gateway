replicaCount: 1

image:
  repository: mcp-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

gateway:
  environment: production
  redisUrl: redis://redis:6379/0
  opaUrl: http://opa:8181
  otlpEndpoint: http://jaeger-collector:4317
  databasePath: /var/lib/mcp-gateway/gateway.sqlite
  auditLogPath: /var/lib/mcp-gateway/audit.jsonl
  sandboxRuntime: hardened-docker
  sandboxImage: mcp-gateway-tool:local
  repairEnabled: false
  repairLlmProvider: openai_compatible
  repairLlmUrl: http://repair-service/v1/chat/completions
  repairLlmModel: repair-model
  repairLlmApiKey: ""
  repairLlmAnthropicVersion: 2023-06-01
  repairLlmMaxTokens: "1024"
  httpHost: 0.0.0.0
  httpPort: "8080"
  httpPath: /mcp
  httpAuthMode: none
  httpAuthToken: ""
  oidcIssuerUrl: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  oidcTimeoutSeconds: "2.0"
  httpMaxRequestBodyBytes: "4194304"
  httpSessionIdleTimeoutSeconds: "1800"
  httpMaxSessions: "10000"
  workerMode: in_process
  workerUrl: http://mcp-gateway-worker:8090
  workerRequestTimeoutSeconds: "120.0"
  workerSharedSecret: ""

worker:
  enabled: false
  existingSecret: ""
  existingSecretKey: shared-secret
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8090
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: mcp-gateway
    tag: latest
    pullPolicy: IfNotPresent
  databasePath: /var/lib/mcp-gateway/gateway.sqlite
  sandboxRuntime: hardened-docker
  sandboxImage: mcp-gateway-tool:local
  dockerSocket:
    enabled: false
    hostPath: /var/run/docker.sock
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

policyBundles:
  tools.rego: |
    package mcp_gateway

    decision := {"outcome": "deny", "matched_rule": "bundle_not_configured", "reason": "Configure policyBundles.tools.rego"}

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
