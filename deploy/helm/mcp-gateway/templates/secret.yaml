{{- if .Values.gateway.repairLlmApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-repair
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.gateway.repairLlmApiKey | quote }}
{{- end }}
{{- if .Values.gateway.httpAuthToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-http-auth
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.httpAuthToken | quote }}
{{- end }}
{{- if and .Values.gateway.workerSharedSecret (not .Values.worker.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-worker-auth
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  shared-secret: {{ .Values.gateway.workerSharedSecret | quote }}
{{- end }}
