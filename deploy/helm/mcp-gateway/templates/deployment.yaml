apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "gateway.http_server"]
          ports:
            - name: gateway
              containerPort: {{ .Values.service.port }}
          env:
            - name: GATEWAY_ENVIRONMENT
              value: {{ .Values.gateway.environment | quote }}
            - name: GATEWAY_REDIS_URL
              value: {{ .Values.gateway.redisUrl | quote }}
            - name: GATEWAY_OPA_URL
              value: {{ .Values.gateway.opaUrl | quote }}
            - name: GATEWAY_OTLP_ENDPOINT
              value: {{ .Values.gateway.otlpEndpoint | quote }}
            - name: GATEWAY_DATABASE_PATH
              value: {{ .Values.gateway.databasePath | quote }}
            - name: GATEWAY_AUDIT_LOG_PATH
              value: {{ .Values.gateway.auditLogPath | quote }}
            - name: GATEWAY_SANDBOX_RUNTIME
              value: {{ .Values.gateway.sandboxRuntime | quote }}
            - name: GATEWAY_SANDBOX_IMAGE
              value: {{ .Values.gateway.sandboxImage | quote }}
            - name: GATEWAY_REPAIR_ENABLED
              value: {{ .Values.gateway.repairEnabled | quote }}
            - name: GATEWAY_REPAIR_LLM_PROVIDER
              value: {{ .Values.gateway.repairLlmProvider | quote }}
            - name: GATEWAY_REPAIR_LLM_URL
              value: {{ .Values.gateway.repairLlmUrl | quote }}
            - name: GATEWAY_REPAIR_LLM_MODEL
              value: {{ .Values.gateway.repairLlmModel | quote }}
            - name: GATEWAY_REPAIR_LLM_ANTHROPIC_VERSION
              value: {{ .Values.gateway.repairLlmAnthropicVersion | quote }}
            - name: GATEWAY_REPAIR_LLM_MAX_TOKENS
              value: {{ .Values.gateway.repairLlmMaxTokens | quote }}
            - name: GATEWAY_HTTP_HOST
              value: {{ .Values.gateway.httpHost | quote }}
            - name: GATEWAY_HTTP_PORT
              value: {{ .Values.gateway.httpPort | quote }}
            - name: GATEWAY_HTTP_PATH
              value: {{ .Values.gateway.httpPath | quote }}
            - name: GATEWAY_HTTP_AUTH_MODE
              value: {{ .Values.gateway.httpAuthMode | quote }}
            - name: GATEWAY_OIDC_ISSUER_URL
              value: {{ .Values.gateway.oidcIssuerUrl | quote }}
            - name: GATEWAY_OIDC_AUDIENCE
              value: {{ .Values.gateway.oidcAudience | quote }}
            - name: GATEWAY_OIDC_JWKS_URL
              value: {{ .Values.gateway.oidcJwksUrl | quote }}
            - name: GATEWAY_OIDC_TIMEOUT_SECONDS
              value: {{ .Values.gateway.oidcTimeoutSeconds | quote }}
            - name: GATEWAY_HTTP_MAX_REQUEST_BODY_BYTES
              value: {{ .Values.gateway.httpMaxRequestBodyBytes | quote }}
            - name: GATEWAY_HTTP_SESSION_IDLE_TIMEOUT_SECONDS
              value: {{ .Values.gateway.httpSessionIdleTimeoutSeconds | quote }}
            - name: GATEWAY_HTTP_MAX_SESSIONS
              value: {{ .Values.gateway.httpMaxSessions | quote }}
            {{- if .Values.gateway.httpAuthToken }}
            - name: GATEWAY_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-http-auth
                  key: token
            {{- end }}
            {{- if .Values.gateway.repairLlmApiKey }}
            - name: GATEWAY_REPAIR_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-repair
                  key: api-key
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mcp-gateway
            - name: policies
              mountPath: /app/policies
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /startupz
              port: gateway
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-gateway.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: policies
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-policies
