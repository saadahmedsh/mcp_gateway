name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Lint and type-check
        run: make lint
      - name: Run tests
        run: make test
      - name: Test policy bundle
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run Rego tests
        run: opa test gateway/policy/policies
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/mcp-gateway
          helm template gateway deploy/helm/mcp-gateway >/dev/null
      - name: Run deterministic evaluation smoke test
        run: make eval
      - name: Build gateway image
        run: docker build --tag mcp-gateway:${{ github.sha }} --file docker/Dockerfile.gateway .
