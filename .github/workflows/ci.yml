name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Lint and type-check
        run: make lint
      - name: Run tests
        run: make test
      - name: Test policy bundle
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run Rego tests
        run: opa test gateway/policy/policies
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/mcp-gateway
          helm template gateway deploy/helm/mcp-gateway >/dev/null
      - name: Run deterministic evaluation smoke test
        run: make eval-gate
      - name: Upload deterministic evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation
          path: eval/results.json
      - name: Build gateway image
        run: docker build --tag mcp-gateway:${{ github.sha }} --file docker/Dockerfile.gateway .

  live-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Start live dependencies and sandbox image
        run: make up
      - name: Run live MCP, Redis, OPA, and sandbox evaluation
        run: .venv/bin/python -m eval.live
      - name: Enforce live security and latency gate
        run: .venv/bin/python -m eval.gate --results eval/live-results.json --max-p95-ms 15000
      - name: Upload live evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation
          path: eval/live-results.json
      - name: Stop live dependencies
        if: always()
        run: docker compose down --volumes
